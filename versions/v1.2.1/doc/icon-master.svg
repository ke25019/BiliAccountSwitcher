<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C8FF"/>
      <stop offset="0.55" stop-color="#00AEEC"/>
      <stop offset="1" stop-color="#008FCF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#B9F3FF" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#B9F3FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#B9F3FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FF9DBA"/>
      <stop offset="1" stop-color="#FB7299"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#005A86" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="10"/>

  <g filter="url(#soft)">
    <!-- top account -->
    <circle cx="151" cy="177" r="51" fill="#FFFFFF"/>
    <circle cx="151" cy="162" r="15" fill="#0099D8"/>
    <path d="M122 203c0-16 13-28 29-28s29 12 29 28v12h-58z" fill="#0099D8"/>

    <!-- top arrow to the right -->
    <path d="M211 177h153" fill="none" stroke="#FFFFFF" stroke-width="29" stroke-linecap="round"/>
    <path d="M354 145l40 32-40 32z" fill="#FFFFFF"/>

    <!-- bottom arrow to the left -->
    <path d="M301 335H148" fill="none" stroke="#FFFFFF" stroke-width="29" stroke-linecap="round"/>
    <path d="M158 303l-40 32 40 32z" fill="#FFFFFF"/>

    <!-- bottom account -->
    <circle cx="361" cy="335" r="51" fill="url(#pink)"/>
    <circle cx="361" cy="320" r="15" fill="#FFFFFF"/>
    <path d="M332 361c0-16 13-28 29-28s29 12 29 28v12h-58z" fill="#FFFFFF"/>
  </g>
</svg>
